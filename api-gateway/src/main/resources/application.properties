# 1. Nombre y puerto de este Gateway
spring.application.name=api-gateway
server.port=8088

# 2. Decirle al Gateway dónde está Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# RUTAS HACIA TUS MICROSERVICIOS
# ==========================================


spring.cloud.gateway.server.webflux.routes[0].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[1].id=productos-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://productos-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

spring.cloud.gateway.server.webflux.routes[2].id=pedidos-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://pedidos-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.server.webflux.routes[3].id=mensajeria-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://mensajeria-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/mensajeria/**

spring.cloud.gateway.server.webflux.routes[4].id=pagos-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://pagos-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/pagos/**

spring.cloud.gateway.server.webflux.routes[5].id=despacho-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://despacho-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/despacho/**

spring.cloud.gateway.server.webflux.routes[6].id=boletas-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://boletas-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/boletas/**

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST